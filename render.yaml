# Bản DEMO trên Render (xem trên điện thoại). Live thật nên chạy trên PC bằng BAT-LIVE.bat
services:
  - type: web
    name: xay-nha-live-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DEMO_BOT
        value: "1"
      - key: CONTROL_PIN
        generateValue: true
